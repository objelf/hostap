driver=nl80211
ssid=MTK-WPA2-2G
ctrl_interface=/var/run/hostapd
ctrl_interface_group=0

logger_stdout=-1
logger_stdout_level=0

country_code=US
hw_mode=g
channel=6

ieee80211d=1

wmm_enabled=1
ieee80211n=1

auth_algs=1
ignore_broadcast_ssid=0

wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=12345678
